# AWS Amplify Hosting (contul de workshop al hackathonului).
#
# Amplify dă variabilele din consolă doar la build, nu și serverului Next.js care rulează după.
# Fără pasul de mai jos, login-ul Google, Stripe și citirea documentelor rulează în mod demo
# (sau dau 500) chiar dacă variabilele sunt setate în consolă. Scriem în .env.production doar
# variabilele pe care le folosește aplicația și numai dacă sunt setate; Next.js o citește la runtime.
# Procedeul e cel din documentația Amplify („Making environment variables accessible to server-side runtimes”).
#
# Variabile de pus în consolă (App settings → Environment variables):
#   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, AUTH_URL (https://main.<app-id>.amplifyapp.com),
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID (opțional),
#   ANTHROPIC_API_KEY, ADMIN_EMAILS (opțional).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - env | grep -E '^(AUTH_SECRET|AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|AUTH_URL|AUTH_TRUST_HOST|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_PRICE_ID|ANTHROPIC_API_KEY|LIMITA_DOCUMENTE_PE_ORA|LIMITA_DOCUMENTE_PE_ZI|LIMITA_ASISTENT_PE_ORA|LIMITA_ASISTENT_PE_ZI|ADMIN_EMAILS)=.+' >> .env.production || true
        - 'echo "variabile pentru runtime: $(cut -d= -f1 .env.production 2>/dev/null | tr "\n" " ")"'
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
