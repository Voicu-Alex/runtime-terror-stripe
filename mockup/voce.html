<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocea aplicației</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Same tokens and font as mockup/index.html (the team's reference design). Light only, like the app.
   Layout: header, what stays the same, situation picker, then one card per personality (3 / 2 / 1 columns). */
:root{
  --paper:#F2F4EF; --card:#FFFFFF; --ink:#14201B; --ink-2:#4A5851; --line:#D6DCD3;
  --accent:#2A3BC9; --accent-soft:#E7EAFB;
  --neg:#9A4630; --neg-soft:#F6E6E0; --pos:#1E7A4B; --pos-soft:#E1F1E7;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:clamp(24px,5vw,32px);letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sub{margin:8px 0 0;color:var(--ink-2);max-width:66ch}
.badge{display:inline-block;margin-top:10px;font-size:13px;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:999px;padding:3px 10px}

.same{margin:22px 0 0;background:var(--ink);color:var(--paper);border-radius:18px;padding:16px 20px}
.same small{display:block;margin-bottom:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.same ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.same li{border:1px solid rgba(242,244,239,.25);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.3}

.bar{margin:24px 0 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.lbl{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:40px}
.chk input{width:18px;height:18px;accent-color:var(--neg);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;min-height:42px}
.pchip[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.grid{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pane.bad{border:1.5px dashed var(--neg)}
.ph{display:flex;gap:10px;align-items:flex-start}
.letter{flex:none;width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.bad .letter{background:var(--neg)}
.ph h3{margin:0;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.ph p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.35}

.thread{display:flex;flex-direction:column;gap:8px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;font-size:15px;margin:0}
.bub.as{background:var(--paper);border-bottom-left-radius:4px;align-self:flex-start}
.bub.us{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.ev{align-self:center;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;text-align:center}
.src{align-self:flex-start;margin:-2px 0 0 4px;font-size:12.5px}
.src b{border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:600;background:var(--card)}
.xtr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.tg{font-size:13px;font-weight:600;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px}
mark{background:var(--neg-soft);color:var(--neg);border-bottom:2px solid var(--neg);padding:0 2px;border-radius:3px}
.nw{white-space:nowrap}
.phd{display:inline-block;font-size:.88em;font-weight:700;color:var(--accent);border:1px dashed var(--accent);border-radius:6px;padding:0 5px;line-height:1.3;white-space:nowrap}

.pc{margin:auto 0 0;padding:12px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:6px}
.pc li{font-size:14px;display:flex;gap:8px;align-items:baseline;line-height:1.35}
.pc li::before{flex:none;font-weight:800;width:10px}
.pc .plus::before{content:"+";color:var(--pos)}
.pc .minus::before{content:"−";color:var(--neg)}
.pc .x::before{content:"×";color:var(--neg)}

/* view tabs */
.views{margin:22px 0 0;display:flex;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px;flex-wrap:wrap}
.views button{flex:1 1 150px;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14.5px;min-height:44px;color:var(--ink-2)}
.views button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.note{margin:12px 0 0;font-size:13.5px;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:10px;padding:8px 12px}
.pane.chosen{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pick{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;align-self:center}

/* act card, as in mockup/index.html */
.acard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--paper)}
.pill.st-adoptat{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.st-in_vigoare{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.acard h4{margin:2px 0 0;font-size:17.5px;line-height:1.2;letter-spacing:-.01em}
.imp{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14.5px}
.imp .v{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--neg)}
.imp .v.zero{font-size:16px;color:var(--ink-2)}
.imp .u{font-weight:600;color:var(--ink-2)}
.imp .est{font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px}
.why{margin:0;font-size:14.5px;color:var(--ink-2)}
.chg{margin:0;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 12px;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px}
.chg>*{min-width:0}
.chg small{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.chg .old{color:var(--ink-2)}
.chg .new{font-weight:700}
.chg .arr{font-weight:800;color:var(--ink-2)}
.tbc{display:inline-block;font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px;width:max-content}
.act{margin:0;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:14px}
.tgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.tgrow .tg{background:var(--paper);border-color:var(--line);color:var(--ink)}
.legal{margin:0;font-size:12.5px;color:var(--ink-2)}
.legal b{color:var(--ink);font-weight:600}

/* lock screen with one notification */
.lock{background:var(--ink);border-radius:16px;padding:14px 10px}
.freq{margin:0;font-size:13.5px;color:var(--ink-2)}
.freq b{color:var(--ink)}
.notif{background:rgba(255,255,255,.97);border-radius:16px;padding:10px 12px}
.nh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.nh .ic{width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.nh b{color:var(--ink);font-weight:700}
.nh .nt{margin-left:auto}
.ntitle{margin:6px 0 2px;font-size:15px;font-weight:700;line-height:1.25}
.nbody{margin:0;font-size:14px;line-height:1.35}
.silent{margin:0;border:1px dashed rgba(242,244,239,.4);border-radius:12px;padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:rgba(242,244,239,.75)}

footer{margin-top:26px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
footer p{margin:0;max-width:70ch}

@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr}.same ul{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="hrow">
      <h1 class="brand" id="brand"></h1>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ro" id="lang-ro">RO</button>
        <button type="button" data-lang="en" id="lang-en">EN</button>
      </div>
    </div>
    <p class="sub" id="sub"></p>
    <span class="badge" id="badge"></span>
  </header>

  <section class="same" aria-labelledby="same-l">
    <small id="same-l"></small>
    <ul id="same"></ul>
  </section>

  <div class="views" role="tablist" id="views"></div>
  <p class="note" id="note" hidden></p>

  <div class="bar">
    <p class="lbl" id="sit-l"></p>
    <label class="chk" id="showbad-w"><input type="checkbox" id="showbad"><span id="showbad-l"></span></label>
  </div>
  <div class="chips" id="sits" role="radiogroup"></div>

  <div class="grid" id="grid"></div>

  <footer>
    <p id="f1"></p>
    <p id="f2"></p>
  </footer>
</div>

  it:{t:'IT-ul intră în rând cu ceilalți', w:'Din ianuarie 2025, scutirea de impozit pe venit pentru IT nu mai există. Net-ul a observat primul.', a:'Cere la HR o simulare a net-ului actual.'},

};

 {id:'quiet', label:'Lună fără noutăți'},

];

 formal:{freq:'acte noi care te privesc și termene, cu 14 zile înainte.',
  new:['Act normativ nou: Pilonul II','Începând cu 5 ian 2027, poți încasa 30% din Pilonul II într-o singură tranșă. Nu este necesară nicio acțiune acum.'],

const CHOSEN = {chat:'friend', sum:'formal', pro:'friend'};
let lang = 'ro', view = 'chat', cur = {chat:'start', sum:'tva', pro:'new'}, showBad = false;
try{
  const s = JSON.parse(localStorage.getItem('voce3') || '{}');
  if(UI[s.lang]) lang = s.lang;
  if(['chat','sum','pro'].includes(s.view)) view = s.view;
  if(s.cur) cur = Object.assign(cur, s.cur);
  showBad = !!s.showBad;
}catch(e){}
const items = () => view==='chat' ? SITS.map(s=>[s.id, s[lang].label]) : view==='sum' ? ACTS.map(a=>[a.id, a.label]) : PRO.map(p=>[p.id, p.label]);

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ph = s => esc(s).replace(/(−?)\{([^}]+)\}/g,'<span class="nw">$1<span class="phd">{$2}</span></span>');
function marked(t, list){
  let h = esc(t);
  list.slice().sort((a,b)=>b.length-a.length).forEach(m=>{ h = h.split(esc(m)).join('\u0000'+esc(m)+'\u0001'); });
  return h.replace(/\u0000/g,'<mark>').replace(/\u0001/g,'</mark>');
}
const ctxHtml = ctx => ctx.map(c => c.ev ? '<p class="ev">'+esc(c.ev)+'</p>' : '<p class="bub us">'+esc(c.us)+'</p>').join('');
const head = (L, name, desc, chosen) => '<div class="ph"><span class="letter" aria-hidden="true">'+L+'</span><div><h3>'+esc(name)+'</h3><p>'+esc(desc)+'</p></div>'+(chosen ? '<span class="pick">'+esc(UI[lang].chosen)+'</span>' : '')+'</div>';

function chatPanes(u){
  const s = SITS.find(x=>x.id===cur.chat)[lang];
  const extras = (s.chips ? '<div class="xtr">'+s.chips.map(c=>'<span class="tg">'+esc(c)+'</span>').join('')+'</div>' : '') +
                 (s.src ? '<p class="src"><b>'+esc(s.src)+'</b></p>' : '');
  let html = PERS.map(p=>{
    const t = p[lang], lines = p.lines[cur.chat][lang], ch = p.id===CHOSEN.chat;
    return '<section class="pane'+(ch?' chosen':'')+'" aria-label="'+p.L+': '+esc(t.name)+'">'+head(p.L, t.name, t.desc, ch)+
      '<div class="thread">'+ctxHtml(s.ctx)+lines.map(b=>'<p class="bub as">'+ph(b)+'</p>').join('')+extras+'</div>'+
      '<ul class="pc"><li class="plus">'+esc(t.plus)+'</li><li class="minus">'+esc(t.minus)+'</li></ul></section>';
  }).join('');
  if(showBad){
    html += '<section class="pane bad" aria-label="'+esc(u.badName)+'">'+head('×', u.badName, u.badDesc)+
      '<div class="thread">'+ctxHtml(s.ctx)+'<p class="bub as">'+marked(s.bad.t, s.bad.m)+'</p></div>'+
      '<ul class="pc">'+s.bad.n.map(n=>'<li class="x">'+esc(n)+'</li>').join('')+'</ul></section>';
  }
  return html;
}
function sumPanes(){
  const R = UI.ro, a = ACTS.find(x=>x.id===cur.sum);
  const imp = a.imp
    ? '<p class="imp"><span>'+R.forYou+'</span><span class="nw"><span class="v">'+ph(a.imp.v)+'</span> <span class="u">'+esc(a.imp.u)+'</span></span>'+(a.imp.est ? '<span class="est">'+R.est+'</span>' : '')+'</p>'
    : '<p class="imp"><span>'+R.forYou+'</span><span class="v zero">'+R.info+'</span></p>';
  const chg = a.chg ? '<p class="chg"><small>'+R.before+'</small>'+(a.chg.old ? '<span class="old">'+esc(a.chg.old)+'</span>' : '<span><span class="tbc">'+R.tbc+'</span></span>')+'<small>'+R.after+'</small><b class="new">'+esc(a.chg.new)+'</b></p>' : '';
  return PERS.map(p=>{
    const t = p[lang], x = SUMS[p.id][a.id], ch = p.id===CHOSEN.sum;
    return '<section class="pane'+(ch?' chosen':'')+'" aria-label="'+p.L+': '+esc(t.name)+'">'+head(p.L, t.name, t.desc, ch)+
      '<div class="acard"><div class="meta"><span class="pill st-'+a.st+'">'+esc(a.stL)+'</span><span class="pill">'+esc(a.date)+'</span></div>'+
      '<h4>'+ph(x.t)+'</h4>'+imp+chg+'<p class="why">'+ph(x.w)+'</p><p class="act">'+ph(x.a)+'</p>'+
      '<div class="tgrow">'+R.tagsAs+' '+a.tags.map(g=>'<span class="tg">'+esc(g)+'</span>').join('')+'</div>'+
      '<p class="legal"><b>'+esc(a.src)+'</b> · '+R.verified+'</p></div></section>';
  }).join('');
}
function proPanes(){
  const R = UI.ro;
  return PERS.map(p=>{
    const t = p[lang], x = PROS[p.id], m = x[cur.pro], ch = p.id===CHOSEN.pro;
    const body = m
      ? '<div class="notif"><div class="nh"><span class="ic">C</span><b>Ce înseamnă pentru mine</b><span class="nt">'+R.now+'</span></div><p class="ntitle">'+ph(m[0])+'</p><p class="nbody">'+ph(m[1])+'</p></div>'
      : '<p class="silent">'+R.silent+'</p>';
    return '<section class="pane'+(ch?' chosen':'')+'" aria-label="'+p.L+': '+esc(t.name)+'">'+head(p.L, t.name, t.desc, ch)+
      '<p class="freq"><b>'+R.freq+'</b> '+esc(x.freq)+'</p><div class="lock">'+body+'</div></section>';
  }).join('');
}

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  $('brand').textContent = u.brand; $('sub').textContent = u.sub; $('badge').textContent = u.badge;
  $('same-l').textContent = u.sameL; $('same').innerHTML = u.same.map(t=>'<li>'+esc(t)+'</li>').join('');
  $('views').innerHTML = ['chat','sum','pro'].map(v=>'<button type="button" role="tab" id="view-'+v+'" data-v="'+v+'" aria-selected="'+(v===view)+'">'+esc(u.views[v])+'</button>').join('');
  const note = view==='sum' ? u.noteSum : view==='pro' ? u.notePro : '';
  $('note').hidden = !note; $('note').textContent = note + (note && u.roOnly ? ' '+u.roOnly : '');
  const lbl = view==='chat' ? u.sit : view==='sum' ? u.actL : u.proL;
  $('sit-l').textContent = lbl; $('sits').setAttribute('aria-label', lbl);
  $('showbad-w').hidden = view!=='chat';
  $('showbad-l').textContent = u.showBad; $('showbad').checked = showBad;
  $('sits').innerHTML = items().map(([id,l])=>'<button type="button" class="pchip" role="radio" id="sit-'+id+'" data-id="'+id+'" aria-checked="'+(id===cur[view])+'">'+esc(l)+'</button>').join('');
  $('f1').innerHTML = ph(u.f1); $('f2').textContent = u.f2;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  $('grid').innerHTML = view==='chat' ? chatPanes(u) : view==='sum' ? sumPanes() : proPanes();
  try{ localStorage.setItem('voce3', JSON.stringify({lang, view, cur, showBad})); }catch(e){}
}
document.querySelector('.lang').addEventListener('click', e=>{ const b = e.target.closest('button'); if(b){ lang = b.dataset.lang; render(); } });
$('views').addEventListener('click', e=>{ const b = e.target.closest('button'); if(b){ view = b.dataset.v; render(); $('view-'+view).focus(); } });
$('showbad').addEventListener('change', e=>{ showBad = e.target.checked; render(); });
$('sits').addEventListener('click', e=>{ const b = e.target.closest('.pchip'); if(b){ cur[view] = b.dataset.id; render(); $('sit-'+cur[view]).focus(); } });
$('sits').addEventListener('keydown', e=>{
  if(!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) return;
  e.preventDefault();
  const ids = items().map(x=>x[0]), i = ids.indexOf(cur[view]), d = (e.key==='ArrowRight'||e.key==='ArrowDown') ? 1 : -1;
  cur[view] = ids[(i+d+ids.length)%ids.length]; render(); $('sit-'+cur[view]).focus();
});
render();
</script>
