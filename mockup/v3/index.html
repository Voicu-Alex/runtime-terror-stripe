<title>Ce înseamnă pentru mine · v3</title>
<!--
PROTOTIP DE ARUNCAT (skill `prototype`, ramura UI, sub-forma B: ecrane noi, fără aplicație reală încă).
Întrebarea: cât FOMO (pierdere în lei + termen din lege) suportă produsul fără să piardă încrederea?
Trei variante pe aceeași pagină: ?v=a|b|c, plus ?s=notif|feed|card|plan|profile|onb|form|stari,
?d=<dată demo ISO>, ?p=andrei|maria|ion, ?on=<id-uri simulate>, ?bar=0 (ascunde bara de prototip, pentru capturi).
Server: python -m http.server 8765 --directory mockup  →  http://localhost:8765/v3/

Decizii din grilling (28 oct 2026): token-urile v2 rămân baza; urgența „c” (suma întâi, termenul pe rândul doi,
fără pulsații, fără cronometru cu secunde); trei variante, B favorită; prag de urgență 30 de zile + dată demo
comutabilă, marcată; „pierzi” doar pe sume sigure (încredere ridicată, nu estimare), estimările scrise „≈ … · estimare”;
IT = ≈520 lei/lună (estimare, brut 8.000; decizia finală a echipei); persona Andrei; notificarea = regula
„cel mai apropiat termen real”; onboarding = chat scriptat cu răspunsuri rapide + formular; Planul meu = două linii
cumulative; doar temă deschisă; desktop = coloană de 680px.

ui-ux-pro-max (din rădăcina repo-ului, fără --persist):
  --design-system "personal finance legal news mobile calm"
     LUAT: Minimalism & Swiss (spațiu alb, ierarhie prin tipografie), Newsreader pentru titluri, checklist (4.5:1, focus, reduced-motion).
     RESPINS: paleta „Breaking red + link blue” (#DC2626 pe #FEF2F2) ca bază și „Hero-Centric” full-bleed: contrazic
       design-research.md („calm”, „culoarea înseamnă stare”). Roșul rămâne doar pentru urgență sub prag, mereu cu text.
  --domain typography "editorial serif news trustworthy"
     LUAT: Newsreader (titluri, B). RESPINS: Roboto ca pereche → Inter (design-research: grotesk tip Inter, cifre tabulare bune);
       perechile all-serif (Cormorant, Playfair): fără sans pentru cifre, contra „precizie de fintech”.
  --domain color "government legal news calm trust"
     LUAT în C: Government/Public Service (#0F172A + #0369A1). RESPINS: Legal „trust gold” #B45309 ca accent (aurul citește a premium/upsell).
  --domain chart "cumulative savings comparison projection"
     LUAT: linie solidă = sigur, linie punctată = simulare, etichete directe, tabel ca alternativă, semn + text, nu doar culoare.
     RESPINS: Waterfall ca grafic principal (întrebarea e „fără vs. cu acțiuni”, nu componența) → folosit doar ca defalcare în C.
       „Line with confidence band”: nu avem interval de încredere real, ar fi inventat.
  --domain landing "urgency scarcity"
     LUAT: termen static scris în text, fără ticker; stare finală statică la reduced-motion; raritate doar verificată și datată.
     RESPINS: tiparul webinar/waitlist (timer în hero, „locuri limitate”, contor de waitlist): nu avem raritate de acest tip.
  --domain ux "notification", "empty state", "loading skeleton", "error message", "number formatting", "chat onboarding conversational"
     LUAT: gol = mesaj + acțiune; încărcare cu aria-busy și text, nu doar schelet; erori cu role=alert, lângă câmp, aria-describedby;
       separator de mii ro-RO; onboarding cu „Sari peste” și alternativă (formular).

A · „Termenul întâi” (urgența pe primul plan)
  Încearcă: fiecare card e Hook = suma mare, Story = termenul + „mai ai N zile” pe rândul doi, Offer = Simulează. Fluxul e sortat
  după cel mai apropiat termen; un bloc întunecat „Următorul termen” deschide ecranul. Bricolage Grotesque peste tot (continuitate v2).
  Sacrifică: contextul de știre (de când, ce s-a schimbat), calmul; actele fără termen par secundare chiar dacă costă mai mult
  (IT −520 lei/lună stă sub Pilon III ≈200 lei/an). Pe 28 oct nimic nu e sub 30 de zile, deci tonul depinde mult de dată.
B · „Calm editorial” (favorita)
  Încearcă: cronologie de știri (Urmează / Deja în vigoare), titluri serif, sumă aliniată la dreapta, urgența doar ca insignă sub 30
  de zile și ca frază de pierdere în cardul deschis. Cel mai aproape de design-research.md.
  Sacrifică: impactul vizual în primele 5 secunde; termenul nu „țipă” până nu intră sub prag.
C · „Planul întâi”
  Încearcă: cârligul e totalul pe 12 luni și banii lăsați pe masă; grafic + defalcare pe acte, apoi rândurile de registru.
  Sacrifică: lectura actelor (rânduri dense, titluri scurte); cere încredere în model înainte de a arăta legea; cifra mare e
  o sumă de estimări.
D · „Revistă” (după tiparul avocatnet.ro, cerut pe 28 oct; vezi docs/research-competitori.md și captures/competitori/avocatnet-*)
  Încearcă: limbajul unei publicații pentru „milioane de români”: antet centrat cu slogan, navigare cu majuscule, filtre pe familii
  de etichete cu număr de acte, articolul principal (următorul termen) pe fundal colorat, blocul „Pentru tine, în cifre”, listă
  simplă și coloana „Termene · ce urmează” cu data mare. Titluri Raleway 800, text Inter, accent albastru regal (#1D4ED8, 6,7:1 pe alb).
  F = gri șobolan (text #57534E, 7,6:1; fundal în degrade spre gri), doar verdele și roșul banilor au culoare.
  E = aceeași pagină în turcoaz (text #0B7A80, 5,1:1; logo #0D9488, folosit doar ca text mare). Pe desktop 3 coloane; pe telefon: bară de filtru închisă, apoi articol, cifre, termene, listă.
  Sacrifică: densitate mare pe telefon; seamănă cu un site de știri, deci „Planul meu” pierde bara fixă (cifrele sunt în bloc).
  Riscă să arate ca avocatnet: brandul, logo-ul și textele sunt ale noastre, doar tiparul de pagină e împrumutat.
Recomandare: B ca bază, cu două împrumuturi: din A, rândul „până la <dată> · mai ai N zile” pe cardurile cu acțiune (nu doar
sub prag), din C, graficul în Planul meu. Detaliile în răspunsul din sesiune și în ADR-ul care urmează alegerii.
-->

<style>
:root{
  --paper:#F2F4EF; --card:#FFFFFF; --ink:#14201B; --ink-2:#4A5851; --line:#D6DCD3;
  --accent:#2A3BC9; --accent-soft:#E7EAFB;
  --neg:#9A4630; --pos:#1E7A4B; --pos-soft:#E1F1E7;
  --urg:#B42318; --urg-soft:#FCEBE9; --past:#5E6A63; --past-bg:#E8EBE6;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Newsreader',Georgia,serif;
  --r:14px; --tb:60px; --pb:0px; --planh:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding:0 16px calc(var(--tb) + var(--planh) + var(--pb) + 28px)}
.nw{white-space:nowrap}
.pre{font-size:.5em;font-weight:600;letter-spacing:0}
.a-hero .pre{display:block;font-size:17px;margin-bottom:2px}
.ahead .pre{font-size:16px}
.bhead .pre,.chd .pre{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.stbox .btn2,.stbox .cta{display:flex;align-items:center;justify-content:center;margin:12px auto 0}
.stbox.err .btn2{margin-left:0}
.stbox.err b+*{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:16px 0 6px}
.brand{margin:0;font-weight:700;font-size:19px;letter-spacing:-.01em}
.demo{font-size:12.5px;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sub{margin:2px 0 14px;font-size:14px;color:var(--ink-2)}
h2.sec{margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* shared atoms */
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);white-space:nowrap}
.st-proiect{background:var(--paper);color:var(--ink-2);border:1px dashed var(--ink-2)}
.st-adoptat{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.st-in_vigoare{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.st-termen_depasit{background:var(--past-bg);color:var(--past);border-color:#C3CAC2}
.est{display:inline-block;font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px;vertical-align:middle}
.simtag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1.5px dashed var(--accent);border-radius:6px;padding:0 6px;vertical-align:middle}
.urgchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#fff;background:var(--urg);border-radius:999px;padding:2px 10px;white-space:nowrap}
.urgchip::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.neg{color:var(--neg)} .pos{color:var(--pos)} .zero{color:var(--ink)}
.tg{display:inline-block;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 9px;margin:0 4px 4px 0}

/* detail (shared, styled per variant) */
.detail{padding:14px 16px 16px;border-top:1px solid var(--line)}
.why{margin:0 0 10px;font-size:15px;max-width:60ch}
.tgrow{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.act{background:var(--paper);border-radius:10px;padding:12px;margin-bottom:12px}
.act.urg{background:var(--urg-soft);box-shadow:inset 3px 0 0 var(--urg)}
.act.exp{background:var(--past-bg);color:var(--past)}
.act .ah{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink-2)}
.act.exp .ah{color:var(--past)}
.act .at{margin:2px 0 6px;font-weight:600}
.act .loss{margin:0 0 6px;font-size:14.5px}
.act .loss b{white-space:nowrap}
.act .none{margin:0;color:var(--ink-2)}
.sw{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;min-height:44px;font-weight:700;font-size:15px}
.track{width:46px;height:28px;border-radius:999px;background:#8A948D;position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] .track{background:var(--accent)}
.sw[aria-checked="true"] .track::after{transform:translateX(18px)}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.res{margin:2px 0 0;font-size:14.5px;font-weight:600;color:var(--accent)}
.legal{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.legal h5{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.legal p{margin:0 0 4px;font-weight:600}
.legal .art{font-weight:500;color:var(--ink-2)}
.legal a{display:flex;align-items:center;min-height:44px;font-weight:600}
.legal .vf{display:block;font-size:12.5px;color:var(--ink-2)}
.chk{font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}
.note{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}

/* plan bar + tab bar + proto bar */
.planbar{position:fixed;left:0;right:0;bottom:calc(var(--tb) + var(--pb));z-index:10}
.planbar button{display:block;width:100%;max-width:680px;margin:0 auto;text-align:left;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(20,32,27,.12);padding:10px 16px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg span{display:block;font-size:12px;color:var(--ink-2)}
.pg b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pg div:last-child{text-align:right}
.pnext{margin:4px 0 0;font-size:12.5px;color:var(--ink-2)}
.tabbar{position:fixed;left:0;right:0;bottom:var(--pb);z-index:12;background:var(--card);border-top:1px solid var(--line)}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tb);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;z-index:50;background:#111;color:#fff;border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:calc(100% - 12px);max-width:560px;font:13px/1.2 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.proto button,.proto select{background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px;min-height:36px;padding:0 10px}
.proto .lbl{font-weight:700;min-width:150px;text-align:center}
body.hasbar{--pb:96px}

/* notification (lock screen) */
.lock{min-height:100vh;background:#1B2420;color:#fff;padding:56px 12px 24px;font-family:var(--sans)}
.lock .clock{text-align:center;font-size:64px;font-weight:300;letter-spacing:-.02em;line-height:1}
.lock .ldate{text-align:center;margin:6px 0 34px;opacity:.85}
.nf{max-width:420px;margin:0 auto;background:rgba(255,255,255,.96);color:var(--ink);border-radius:22px;padding:14px 16px 12px}
.nh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.nh .ic{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.nh b{color:var(--ink)} .nh .nt{margin-left:auto}
.nf .hook{margin:10px 0 2px;font-size:17px;font-weight:700;line-height:1.25}
.nf .story{margin:4px 0 12px;font-size:14.5px;color:var(--ink-2)}
.nf .story b{color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:12px;min-height:46px;text-decoration:none}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;border:0;background:none;color:var(--ink-2);text-decoration:underline;min-height:44px;font-size:14px}
.lock .hint{max-width:420px;margin:16px auto 0;font-size:13px;opacity:.8;text-align:center}

/* chart + table */
.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--sans);fill:var(--ink-2)}
.chart .lb{font-weight:700;fill:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent)}
.disc{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
.big2 span{display:block;font-size:12.5px;color:var(--ink-2)}
.big2 b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.alist li:first-child{border-top:0}
.alist .an{font-size:14.5px;font-weight:600}
.alist .ad{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500}

/* profile */
.grp{margin-top:16px}
.grp h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.ptag{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:0 0 0 14px;margin:0 6px 8px 0;font-weight:600;font-size:15px;min-height:44px}
.ptag button{border:0;background:none;width:44px;height:44px;border-radius:50%;font-size:18px;color:var(--ink-2)}
.ptag.add{border-style:dashed;color:var(--ink-2);padding:0 14px;background:none}
.ex{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);max-width:60ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn2{border:1.5px solid var(--ink);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}

/* onboarding chat */
.onbtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 4px}
.onbtop button{border:0;background:none;color:var(--accent);text-decoration:underline;font-weight:600;min-height:44px;padding:0 4px}
.prog{font-size:13px;color:var(--ink-2)}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;margin:0 0 8px}
.bub.as{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.us{background:var(--accent);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.xtr{margin:0 0 12px;max-width:92%}
.xt{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 0 0 10px;margin:0 6px 6px 0;font-weight:600}
.xt small{font-weight:500;color:var(--ink-2);margin-left:4px}
.xt button{border:0;background:none;color:var(--accent);width:44px;height:44px;font-size:16px}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.qr button{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;min-height:44px;padding:0 14px;font-weight:600}
.compose{position:sticky;bottom:calc(var(--pb) + 8px);display:flex;gap:8px;background:var(--paper);padding:8px 0}
.compose input{flex:1;min-width:0;border:1px solid var(--ink-2);border-radius:999px;padding:0 16px;min-height:46px;background:var(--card)}
.compose button{border:0;background:var(--accent);color:#fff;border-radius:50%;width:46px;height:46px;font-size:18px;flex:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.final{border:1.5px solid var(--accent);background:var(--card);border-radius:16px;padding:14px;margin:4px 0 12px}
.final .hook{margin:0 0 4px;font-weight:700;font-size:17px}
.final p{margin:0 0 10px;font-size:14.5px;color:var(--ink-2)}
.tally{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin:6px 0 12px;font-size:14px}
.tally b{font-size:16px}

/* form */
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;font-size:15px;margin-bottom:8px}
.ck{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:44px;padding:0 14px 0 10px;margin:0 6px 8px 0;font-weight:600;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fld{display:block;margin-bottom:6px;font-weight:600}
.inp{width:100%;min-height:46px;border:1px solid var(--ink-2);border-radius:10px;padding:0 12px;background:var(--card)}
.help{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.err{font-size:13.5px;color:var(--urg);font-weight:600;margin:4px 0 0}
.inp[aria-invalid="true"]{border:2px solid var(--urg)}

/* states sheet */
.sheet h3{margin:26px 0 8px;font-size:15px}
.sheet h3 small{font-weight:500;color:var(--ink-2)}

var Q=new URLSearchParams(location.search);
var S={v:VARIANTS[Q.get('v')]?Q.get('v'):'b',s:SCREENS[Q.get('s')]?Q.get('s'):'feed',d:Q.get('d')||DEMO_DATES[0][0],
  p:PERSONAS[Q.get('p')]?Q.get('p'):'andrei',on:{},open:Q.get('open'),bar:Q.get('bar')!=='0',removed:[],f:'all'};
(Q.get('on')||'').split(',').forEach(function(id){if(id)S.on[id]=true});

/* ---------- formatare ---------- */
var NF=new Intl.NumberFormat('ro-RO',{maximumFractionDigits:0});
var MONTHS=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];
var MONTHS_L=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
function lei(n){return NF.format(Math.abs(Math.round(n)))}
function sgn(n){var r=Math.round(n);return (r<0?'−':r>0?'+':'')+lei(r)}
function cls(n){var r=Math.round(n);return r<0?'neg':r>0?'pos':'zero'}
function fd(iso){var p=iso.split('-');return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0]}
function fdShort(iso){var p=iso.split('-');return (+p[2])+' '+MONTHS[+p[1]-1]}
function dn(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function daysTo(iso){return dn(iso)-dn(S.d)}
function zile(n){if(n===1)return '1 zi';var m=n%100;return n+((m>=20||m===0)?' de zile':' zile')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function tagName(id){return TAGS[id]?TAGS[id][0]:id}

/* ---------- calcul ---------- */
function activeTags(){return PERSONAS[S.p].tags.filter(function(t){return S.removed.indexOf(t)<0})}
function effIdx(iso){return iso<=S.d?0:Math.ceil(daysTo(iso)/30.4375)}
function calc(){
  var p=PERSONAS[S.p],tags=activeTags(),cards=[];
  RULES.forEach(function(r){
    var common=tags.filter(function(t){return r.tags.indexOf(t)>=0});
    if(!common.length)return;
    var a=r.action,dl=a&&a.deadline,m=Math.round(r.impact(p)),sv=a?a.saving(p):0;
    var expired=!!(dl&&dl<S.d),days=dl&&!expired?daysTo(dl):null;
    var status=expired?'termen_depasit':(r.status==='adoptat'&&r.effective<=S.d?'in_vigoare':r.status);
    var on=!expired&&sv>0&&!!S.on[r.id];
    var ei=effIdx(r.effective),months=Math.max(0,12-ei);
    cards.push({r:r,a:a,dl:dl,m:m,sv:sv,svYr:sv*12,on:on,expired:expired,days:days,status:status,common:common,ei:ei,months:months,
      urgent:days!==null&&days<=URG_DAYS&&sv>0&&status!=='proiect',
      upcomingEff:r.effective>S.d?daysTo(r.effective):null,
      sure:r.conf==='high'&&!r.est});
  });
  var base=[0],sim=[0];
  for(var i=1;i<=12;i++){
    var b=0,s=0;
    cards.forEach(function(c){if(c.ei<=i-1){b+=c.m;if(c.on)s+=c.sv;}});
    base.push(base[i-1]+b);sim.push(sim[i-1]+b+s);
  }
  var next=null;cards.forEach(function(c){if(c.days!==null&&c.sv>0&&(!next||c.dl<next.dl))next=c});
  return {cards:cards,base:base,sim:sim,total:base[12],totalSim:sim[12],nOn:cards.filter(function(c){return c.on}).length,next:next};
}
/* regula notificării: cel mai apropiat termen real cu bani; altfel cea mai apropiată dată de aplicare */
function pickNotif(R){
  if(R.next)return R.next;
  var u=R.cards.filter(function(c){return c.upcomingEff!==null}).sort(function(a,b){return a.upcomingEff-b.upcomingEff});
  return u[0]||null;
}

/* ---------- bucăți comune ---------- */
function statusPill(c){var L={proiect:'proiect',adoptat:'adoptat',in_vigoare:'în vigoare',termen_depasit:'termen depășit'};return '<span class="pill st-'+c.status+'">'+L[c.status]+'</span>'}
function estTag(c){return c.r.est&&!isD()?' <span class="est">estimare</span>':''}
/* cârligul: suma lunară dacă există, altfel banii din acțiune pe an */
function hook(c){
  var ap=c.r.est&&!isD()?'≈ ':''; /* D: limbaj vizual simplu, estimarea e explicată în card */
  if(c.m!==0)return {v:ap+sgn(c.m),u:'lei/lună',k:cls(c.m)};
  if(c.svYr>0&&!c.expired)return {pre:'până la',v:ap+'+'+lei(c.svYr),u:'lei/an',k:'pos'};
  return {v:'0',u:'lei/lună acum',k:'zero'};
}
function hv(h){return (h.pre?'<span class="pre">'+h.pre+'</span> ':'')+h.v}
function deadlineText(c,short){
  if(c.dl&&c.expired)return {t:'Termen depășit: '+fd(c.dl),k:'past'};
  if(c.dl)return {t:'până la '+(short?fdShort(c.dl):fd(c.dl))+' · <span class="nw">mai ai '+zile(c.days)+'</span>',k:c.urgent?'urg':'dl'};
  if(c.upcomingEff!==null)return {t:'se aplică de la '+fd(c.r.effective)+' · <span class="nw">peste '+zile(c.upcomingEff)+'</span>',k:'eff'};
  return null;
}
function lossLine(c){
  if(!c.a||!c.dl||c.sv<=0)return '';
  if(c.expired)return '<p class="loss">Termenul a trecut pe '+fd(c.dl)+'. Cu acțiunea făcută la timp, ai fi plătit cu <b>'+lei(c.sv)+' lei/lună</b> mai puțin.</p>';
  if(c.sure)return '<p class="loss">Dacă nu faci asta până la '+fd(c.dl)+', pierzi <b>'+lei(c.svYr)+' lei/an</b>.</p>';
  return '<p class="loss">Dacă nu faci asta până la '+fd(c.dl)+', lași pe masă până la <b>≈ '+lei(c.svYr)+' lei/an</b> <span class="est">estimare</span></p>';
}
function actionBox(c){
  var a=c.a;
  if(!a)return '<div class="act"><p class="none">Nicio acțiune disponibilă. Îți arătăm impactul ca să nu te ia prin surprindere.</p></div>';
  var head=c.dl?(c.expired?'Termen depășit: '+fd(c.dl):'Ce poți face până la '+fd(c.dl)+(c.urgent?' · mai ai '+zile(c.days):'')):'Ce poți face, oricând:';
  var sw='';
  if(c.sv>0){
    sw='<button type="button" class="sw" role="switch" aria-checked="'+c.on+'" data-sim="'+c.r.id+'"'+(c.expired?' disabled':'')+'><span class="track"></span>Simulează</button>';
    if(c.on)sw+='<p class="res">'+'<span class="simtag">simulare</span> '+(c.r.est?'≈ ':'')+'+'+lei(c.sv)+' lei/lună · +'+lei(c.svYr)+' lei/an în Planul meu</p>';
  }
  return '<div class="act'+(c.urgent?' urg':'')+(c.expired?' exp':'')+'"><p class="ah">'+head+'</p><p class="at">'+esc(a.text)+'</p>'+lossLine(c)+sw+'</div>';
}
function legalBox(c){
  var r=c.r;
  return '<div class="legal"><h5>Sursa legală</h5><p>'+r.act+' · '+r.mo+'</p><p class="art">'+r.art+(r.artTbc?'<span class="chk">articol de confirmat</span>':'')+'</p>'+
   '<a href="'+r.url+'" target="_blank" rel="noopener">Textul legii pe Portal Legislativ ↗</a>'+
   '<a href="'+r.sec+'" target="_blank" rel="noopener">Explicație (ANAF / presă) ↗</a>'+
   '<span class="vf">verificat la 28 oct 2026'+(r.conf==='low'?' · sursă de încredere scăzută':'')+'</span></div>';
}
function detail(c){
  var estNote=isD()&&c.r.est?'<p class="note">Suma e calculul nostru pe profilul tău, nu o cifră scrisă în lege.</p>':'';
  return '<div class="detail" id="d-'+c.r.id+'"><p class="why"><b>Pentru tine:</b> '+c.r.why+'</p>'+(c.r.note?'<p class="note">'+c.r.note+'</p>':'')+estNote+
   '<p class="tgrow">Te privește ca: '+c.common.map(function(t){return '<span class="tg">'+tagName(t)+'</span>'}).join('')+'</p>'+actionBox(c)+legalBox(c)+'</div>';
}
function header(sub){
  if(isD())return masthead()+(sub?'<p class="sub" style="margin-top:14px">'+sub+'</p>':'');
  return '<header class="hd"><h1 class="brand">Ce înseamnă pentru mine</h1><span class="demo" title="Data folosită pentru calcule în demo">demo · azi '+fd(S.d)+'</span></header>'+(sub?'<p class="sub">'+sub+'</p>':'');
}
function planBar(R){
  var nx=R.next?'Următorul termen: '+fd(R.next.dl)+' · mai ai '+zile(R.next.days):'Niciun termen deschis';
  return '<div class="planbar"><button type="button" data-go="plan" aria-label="Deschide Planul meu"><div class="pg"><div><span>Fără acțiuni · 12 luni</span><b class="'+cls(R.total)+'">'+sgn(R.total)+' lei</b></div>'+
   '<div><span>'+(R.nOn?'Cu acțiuni <span class="simtag">simulare</span>':'Cu acțiuni · 12 luni')+'</span><b class="'+cls(R.totalSim)+'">'+sgn(R.totalSim)+' lei</b></div></div><p class="pnext">'+nx+'</p></button></div>';
}

/* ---------- grafic: două linii cumulative ---------- */
function chart(R,h){
  h=h||190;var W=340,pl=6,pr=86,pt=14,pb=26;
  var all=R.base.concat(R.sim),mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([0]));
  if(mx===mn)mn=mx-1;
  function x(i){return pl+(W-pl-pr)*i/12}
  function y(v){return pt+(h-pt-pb)*(mx-v)/(mx-mn)}
  function path(a){return a.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ')}
  var m0=new Date(dn(S.d)*864e5),lab=function(i){var d=new Date(Date.UTC(m0.getUTCFullYear(),m0.getUTCMonth()+i,1));return MONTHS[d.getUTCMonth()]+(i===0||d.getUTCMonth()===0?' '+String(d.getUTCFullYear()).slice(2):'')};
  var diff=R.totalSim-R.total,yb=y(R.total),ys=y(R.totalSim);
  if(Math.abs(yb-ys)<30){if(ys<=yb){ys=yb-30}else{ys=yb+30}}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="Impact cumulat pe 12 luni: fără acțiuni '+sgn(R.total)+' lei, cu acțiuni '+sgn(R.totalSim)+' lei">';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--line)" stroke-width="1.5"/><text x="'+(W-pr+4)+'" y="'+(y(0)+4)+'">0 lei</text>';
  [0,6,12].forEach(function(i){s+='<text x="'+x(i)+'" y="'+(h-6)+'" text-anchor="'+(i===0?'start':i===12?'end':'middle')+'">'+lab(i)+'</text>'});
  s+='<path d="'+path(R.base)+'" fill="none" stroke="var(--ink)" stroke-width="2.5"/>';
  if(R.nOn)s+='<path d="'+path(R.sim)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5"/>';
  s+='<text class="lb" x="'+(W-pr+6)+'" y="'+(yb+4)+'">'+sgn(R.total)+'</text><text x="'+(W-pr+6)+'" y="'+(yb+18)+'">fără acțiuni</text>';
  if(R.nOn)s+='<text class="lb" x="'+(W-pr+6)+'" y="'+(ys-14)+'" style="fill:var(--accent)">'+sgn(R.totalSim)+'</text><text x="'+(W-pr+6)+'" y="'+(ys)+'" style="fill:var(--accent)">cu acțiuni</text>';
  return s+'</svg>';
}
function chartTable(R){
  var rows='';for(var i=3;i<=12;i+=3)rows+='<tr><td>după '+i+' luni</td><td>'+sgn(R.base[i])+' lei</td><td>'+sgn(R.sim[i])+' lei</td></tr>';
  return '<details><summary>Vezi ca tabel</summary><table class="tbl"><thead><tr><th>Perioadă</th><th>Fără acțiuni</th><th>Cu acțiuni</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}

    '<button type="button" class="sw" role="switch" aria-label="Simulează: '+esc(c.a.text)+'" aria-checked="'+c.on+'" data-sim="'+c.r.id+'"'+(c.expired?' disabled':'')+'><span class="track"></span></button></li>'}).join('')+'</ul>';

/* ======================= A · Termenul întâi ======================= */
function sortA(cards){
  function key(c){if(c.expired)return [3,0];if(c.days!==null&&c.sv>0)return [0,c.days];if(c.upcomingEff!==null)return [1,c.upcomingEff];return [2,-Math.abs(c.m)]}
  return cards.slice().sort(function(a,b){var x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]});
}
function aHero(c){
  if(!c)return '';
  var h=hook(c.days!==null?{m:0,svYr:c.svYr,r:c.r,expired:false}:c);
  var dots='';var span=90,left=Math.min(span,c.days||0);for(var i=0;i<18;i++)dots+='<i'+(i<Math.round(18*left/span)?' class="on"':'')+'></i>';
  return '<section class="a-hero'+(c.urgent?' urg':'')+'" aria-label="Următorul termen"><p class="k">Următorul termen</p>'+
   '<p class="amt">'+hv(h)+'<small>'+h.u+'</small>'+(c.r.est?'<span class="est">estimare</span>':'')+'</p>'+
   '<p class="dl">până la '+fd(c.dl)+' · <span class="nw">mai ai '+zile(c.days)+'</span>'+(c.urgent?' <span class="urgchip">sub '+URG_DAYS+' de zile</span>':'')+'</p>'+
   '<div class="days'+(c.urgent?' urg':'')+'" aria-hidden="true">'+dots+'</div><div class="dcap" aria-hidden="true"><span>azi</span><span>'+fdShort(c.dl)+'</span></div>'+
   '<p class="t">'+esc(c.r.title)+(c.on?' · <span class="simtag" style="color:#fff;border-color:#fff">simulare pornită</span>':'')+'</p><button type="button" class="cta" data-open="'+c.r.id+'">'+(c.on?'Vezi cardul':'Simulează')+'</button></section>';
}
function aCard(c){
  var h=hook(c),dt=deadlineText(c),open=S.open===c.r.id;
  return '<article class="ac'+(c.dl&&!c.expired?' has-dl':'')+(c.urgent?' urg':'')+(c.expired?' exp':'')+'" id="c-'+c.r.id+'">'+
   '<button type="button" class="ahead" aria-expanded="'+open+'" aria-controls="d-'+c.r.id+'" data-tog="'+c.r.id+'">'+
   '<span class="amt '+h.k+'">'+hv(h)+'<small>'+h.u+'</small>'+estTag(c)+'</span>'+
   (dt?'<span class="dl '+dt.k+'">'+dt.t+(c.urgent?' <span class="urgchip">urgent</span>':'')+'</span>':'')+
   '<span class="ttl">'+esc(c.r.title)+'</span><span class="meta">'+statusPill(c)+'<span>'+c.r.act+'</span></span></button>'+(open?detail(c):'')+'</article>';
}
function feedA(R){
  var cs=sortA(R.cards),nx=R.next;
  var withDl=cs.filter(function(c){return !c.expired&&(c.days!==null&&c.sv>0||c.upcomingEff!==null)}),rest=cs.filter(function(c){return withDl.indexOf(c)<0});
  return header()+aHero(nx)+
   '<h2 class="sec">Cu termen, în ordinea termenului</h2>'+withDl.filter(function(c){return c!==nx||S.open===c.r.id}).map(aCard).join('')+
   '<h2 class="sec">Deja în vigoare</h2>'+rest.map(aCard).join('');
}

/* ======================= B · Calm editorial ======================= */
function bItem(c){

  var dt0=deadlineText(c),kick=statusPill(c)+'<span>'+(dt0&&dt0.k==='eff'?'':(c.r.effective>S.d?'schimbarea de la ':'din ')+fd(c.r.effective)+' · ')+c.r.act+'</span>'+(c.urgent?'<span class="urgchip">mai ai '+zile(c.days)+'</span>':'');
  var dlh='';if(dt&&!c.urgent)dlh='<span class="dl">'+(dt.k==='past'?dt.t:(dt.k==='eff'?dt.t:'Acțiune <b>'+dt.t+'</b>'))+'</span>';
  return '<article class="bi'+(c.expired?' exp':'')+'" id="c-'+c.r.id+'"><button type="button" class="bhead" aria-expanded="'+open+'" aria-controls="d-'+c.r.id+'" data-tog="'+c.r.id+'">'+
   '<span class="kick">'+kick+'</span><span class="ttl">'+esc(c.r.title)+'</span>'+
   '<span class="row">'+dlh+'<span class="amt '+h.k+'">'+hv(h)+' <small>'+h.u+'</small>'+estTag(c)+'</span></span></button>'+(open?detail(c):'')+'</article>';
}
function feedB(R){
  var ev=function(c){return c.dl&&!c.expired?c.dl:c.r.effective};
  var up=R.cards.filter(function(c){return ev(c)>=S.d}).sort(function(a,b){return ev(a)<ev(b)?-1:1});
  var past=R.cards.filter(function(c){return ev(c)<S.d}).sort(function(a,b){return a.r.effective>b.r.effective?-1:1});
  var lede=R.next?'<p class="lede">Următorul lucru care contează pentru tine are termen pe '+fd(R.next.dl)+'.</p>':'<p class="lede">Niciun termen deschis acum. Mai jos, ce s-a schimbat deja.</p>';
  return header()+lede+'<p class="sub">'+R.cards.length+' acte care te privesc · '+PERSONAS[S.p].name+'</p>'+
   '<h2 class="sec">Urmează</h2>'+up.map(bItem).join('')+'<h2 class="sec">Deja în vigoare</h2>'+past.map(bItem).join('');
}

function cRow(c){
  var open=S.open===c.r.id,yr=c.m*c.months,dt=deadlineText(c,true);
  var yv=c.m!==0?(c.r.est?'≈ ':'')+sgn(yr)+' lei':(c.svYr>0&&!c.expired?'până la '+(c.r.est?'≈ ':'')+'+'+lei(c.svYr)+' lei':'0 lei');
  return '<article class="cr'+(c.expired?' exp':'')+'" id="c-'+c.r.id+'"><button type="button" class="chd" aria-expanded="'+open+'" aria-controls="d-'+c.r.id+'" data-tog="'+c.r.id+'">'+
   '<span class="ttl">'+esc(c.r.title)+'</span><span class="yr '+cls(c.m!==0?yr:c.svYr)+'">'+yv+'</span>'+
   '<span class="s2">'+statusPill(c)+(c.m!==0?'<span>'+sgn(c.m)+' lei/lună × '+c.months+'</span>':'')+(dt?'<span>'+dt.t+'</span>':'')+(c.urgent?'<span class="urgchip">urgent</span>':'')+estTag(c)+'</span></button>'+(open?detail(c):'')+'</article>';
}
function waterfall(R){
  var cs=R.cards.filter(function(c){return c.m!==0||c.on}),mx=1;
  cs.forEach(function(c){mx=Math.max(mx,Math.abs(c.m*c.months),c.on?c.sv*c.months:0)});
  var li=cs.sort(function(a,b){return a.m*a.months-b.m*b.months}).map(function(c){
    var v=c.m*c.months,out='';
    if(c.m!==0)out+='<li><span>'+esc(c.r.title)+'</span><span class="v '+cls(v)+'">'+(c.r.est?'≈ ':'')+sgn(v)+' lei</span><span class="bar" style="width:'+Math.max(2,100*Math.abs(v)/mx)+'%"></span></li>';
    if(c.on)out+='<li><span><span class="simtag">simulare</span> '+esc(c.a.text)+'</span><span class="v pos">+'+lei(c.sv*c.months)+' lei</span><span class="bar s" style="width:'+Math.max(2,100*c.sv*c.months/mx)+'%"></span></li>';
    return out}).join('');
  return '<ul class="wf" aria-label="Defalcare pe acte, 12 luni">'+li+'</ul>';
}
function cTop(R,full){
  var left=R.cards.filter(function(c){return c.sv>0&&!c.expired&&!c.on}).reduce(function(s,c){return s+c.sv*Math.max(c.months,c.dl?12:0)},0);
  var est=R.cards.some(function(c){return c.sv>0&&!c.on&&!c.expired&&c.r.est});
  return '<section class="c-top"><p class="k">Legile noi, pe 12 luni, pentru tine</p><p class="tot '+cls(R.total)+'">≈ '+sgn(R.total)+'<small>lei · fără acțiuni</small></p>'+
   (left>0?'<p class="left">Bani lăsați pe masă dacă nu faci nimic: <b class="pos">până la '+(est?'≈ ':'')+lei(left)+' lei</b>'+(R.next?', primul termen pe '+fd(R.next.dl)+' (mai ai '+zile(R.next.days)+')':'')+'.</p>':'')+
   chart(R,full?200:150)+(full?chartTable(R):'')+(full?'':'<button type="button" class="cta" data-go="plan">Vezi planul și simulează</button>')+'</section>';
}
function feedC(R){
  var cs=R.cards.slice().sort(function(a,b){if(a.expired!==b.expired)return a.expired?1:-1;return Math.abs(b.m*b.months)+b.svYr-(Math.abs(a.m*a.months)+a.svYr)});
  return header()+cTop(R,false)+'<h2 class="sec">Pe acte, după impact</h2>'+cs.map(cRow).join('');
}

    if(c.days!==null&&c.sv>0)ev.push({iso:c.dl,c:c,t:c.a.text,k:'dl'});
    else if(c.upcomingEff!==null)ev.push({iso:c.r.effective,c:c,t:'Se aplică: '+c.r.title,k:'eff'});
  });

  return '<ul class="cal">'+ev.map(function(e){
    var c=e.c,d=daysTo(e.iso),amt=e.k==='dl'?'<span class="pos">+'+lei(c.svYr)+' lei/an</span>':(c.m?'<span class="'+cls(c.m)+'">'+sgn(c.m)+' lei/lună</span>':'');

function feedD(R){

  var cnt=function(G){return all.filter(function(c){return groupsOf(c).indexOf(G)>=0}).length};
  var gs=GROUPS.filter(function(G){return cnt(G)>0});
  var flt='<ul class="flt">'+[['all','Toate',all.length,'#111827']].concat(gs.map(function(G){return [G,G,cnt(G),DOTS[G]]})).map(function(g){
    return '<li><button type="button" data-f="'+g[0]+'" aria-pressed="'+(S.f===g[0])+'"><i style="background:'+g[3]+'"></i>'+g[1]+' <small>'+g[2]+'</small></button></li>'}).join('')+'</ul>';
  var fbar='<div class="fbar"><span class="fi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg></span><label>Ești în<select data-set="f">'+
   [['all','Toate actele']].concat(gs.map(function(G){return [G,G]})).map(function(o){return '<option value="'+o[0]+'"'+(S.f===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label></div>';
  var left='<aside class="dside l" aria-label="Filtre"><p class="sideh">Filtre flux</p>'+flt+'<p class="sideh" style="margin-top:22px">De făcut</p><ul class="flt"><li><button type="button" data-go="plan"><i style="background:var(--accent)"></i>Planul meu <small>'+all.filter(function(c){return c.sv>0&&!c.expired}).length+'</small></button></li></ul>'+
   '<p class="sidenote" style="margin-top:18px">'+PERSONAS[S.p].name+' · profilul rămâne pe telefon.</p></aside>';
  var right='<aside class="dside r" aria-label="Termene"><p class="sideh">Termene · ce urmează</p><p class="sidenote" style="margin:0 0 4px">Calculate față de azi, din datele din lege.</p>'+dCal(cs)+'</aside>';
  var main='<div class="dmain">'+fbar+dFeat(nx)+dStats(R,cs)+'<div class="calm"><h2 class="secd">Termene · ce urmează</h2>'+dCal(cs)+'</div>'+
   '<h2 class="secd">Toate actele care te privesc <small>după impact</small></h2><ol class="nl">'+rest.map(dItem).join('')+'</ol>'+DISC_D+'</div>';
  return masthead()+'<div class="dgrid">'+left+main+right+'</div>';
}

/* ======================= Planul meu ======================= */
function planScreen(R){
  var nums='<div class="big2"><div><span>Fără acțiuni · 12 luni</span><b class="'+cls(R.total)+'">'+sgn(R.total)+' lei</b></div><div><span>Cu acțiuni · '+(R.nOn?'<span class="simtag">simulare</span>':'nimic ales')+'</span><b class="'+cls(R.totalSim)+'">'+sgn(R.totalSim)+' lei</b></div></div>';
  var nx=R.next?'<p class="sub" style="margin:0 0 8px">Următorul termen: <b>'+fd(R.next.dl)+'</b> · mai ai '+zile(R.next.days)+(R.next.urgent?' <span class="urgchip">urgent</span>':'')+'</p>':'';
  var acts='<section class="box"><h2 class="sec" style="margin-top:0">Acțiuni pe care legea le permite</h2>'+actionsList(R)+'</section>';
  if(S.v==='a')return header('Planul meu')+aHero(R.next)+'<section class="box">'+nums+chart(R)+chartTable(R)+DISC+'</section>'+acts;
  if(S.v==='c')return header('Planul meu')+cTop(R,true)+'<section class="box"><h2 class="sec" style="margin-top:0">Din ce se compune</h2>'+waterfall(R)+DISC+'</section>'+acts;
  return header()+'<p class="lede">Planul meu: ce se întâmplă cu banii tăi în următoarele 12 luni.</p>'+'<section class="box">'+nums+nx+chart(R)+chartTable(R)+DISC+'</section>'+acts;
}

/* ======================= Notificarea ======================= */
function notifScreen(R){
  var c=pickNotif(R),now=new Date(dn(S.d)*864e5),wd=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'][now.getUTCDay()];
  var head='<div class="nh"><span class="ic" aria-hidden="true">CÎ</span><b>Ce înseamnă pentru mine</b><span class="nt">acum</span></div>';
  var body;
  if(!c)body='<p class="hook">Nimic nou care să te privească</p><p class="story">Nu e niciun termen deschis pentru etichetele tale.</p>';
  else{
    var tags=c.common.map(tagName).join(', '),amt=c.days!==null?('până la '+(c.r.est?'≈ ':'')+lei(c.svYr)+' lei/an'):'';
    var est=c.r.est?' · estimare':'';
    if(c.days===null){ /* doar dată de aplicare */
      body='<p class="hook">'+esc(c.r.title)+'</p><p class="story">Se aplică de la '+fd(c.r.effective)+' (peste '+zile(c.upcomingEff)+'). Te privește ca: <b>'+tags+'</b>.</p>';
    }else if(S.v==='a'){
      body='<p class="hook">'+amt+est+'</p><p class="hook" style="margin-top:0;font-size:15.5px">până la '+fd(c.dl)+' · mai ai '+zile(c.days)+(c.urgent?' <span class="urgchip">urgent</span>':'')+'</p>'+
       '<p class="story">'+esc(c.r.title)+'. Te privește ca: <b>'+tags+'</b>. Plafonul e anual.</p>';
    }else if(S.v==='c'){
      body='<p class="hook">Planul tău pe 12 luni: ≈ '+sgn(R.total)+' lei</p><p class="story">O acțiune cu termen pe '+fd(c.dl)+' (mai ai '+zile(c.days)+') aduce '+amt+est+'. Te privește ca: <b>'+tags+'</b>.</p>';
    }else{
      body='<p class="hook">'+esc(c.r.title.split(':')[0])+': '+amt+est+'</p><p class="story">Fereastra pentru '+c.dl.slice(0,4)+' se închide pe '+fd(c.dl)+' (mai ai '+zile(c.days)+'). Te privește ca: <b>'+tags+'</b>.</p>';
    }
  }
  var hh=String(9).padStart(2,'0')+':41';
  return '<div class="lock"><div class="clock">'+hh+'</div><div class="ldate">'+wd+', '+fd(S.d)+' (demo)</div><div class="nf" role="group" aria-label="Notificare">'+head+body+
   (c?'<button type="button" class="cta" data-open="'+c.r.id+'">'+(S.v==='c'?'Vezi planul':'Simulează')+'</button>':'')+'<button type="button" class="ghost" data-go="feed">Mai târziu</button></div>'+
   '<p class="hint">Cârlig: suma · Poveste: de ce te privește · Ofertă: acțiunea cu termen</p></div>';
}

/* ======================= Profil ======================= */
function profileScreen(){
  var tags=activeTags();
  var g=GROUPS.map(function(G){
    var ts=tags.filter(function(t){return TAGS[t]&&TAGS[t][1]===G});
    return '<section class="grp"><h3>'+G+'</h3>'+(ts.length?ts.map(function(t){return '<span class="ptag">'+tagName(t)+'<button type="button" data-rm="'+t+'" aria-label="Elimină eticheta '+tagName(t)+'">×</button></span>'}).join(''):'')+
     '<button type="button" class="ptag add">+ adaugă</button>'+(G==='Domeniul meu'?'<p class="ex">Exemplu real: OUG 156/2024 a eliminat, din ianuarie 2025, scutirea de impozit pentru salariații din IT, construcții, agricultură și industria alimentară.</p>':'')+'</section>'}).join('');
  return header()+'<p class="'+(S.v==='b'?'lede':'sub')+'">Profilul tău: '+PERSONAS[S.p].name+'. Etichetele decid ce acte vezi.</p>'+g+
   '<div class="btnrow"><button type="button" class="btn2" data-go="onb">Refă conversația</button><button type="button" class="btn2" data-go="form">Formular</button></div>'+
   '<p class="disc">Profilul rămâne pe telefonul tău. Fără cont, fără bancă.</p>';
}

/* ======================= Onboarding ======================= */
function xt(id,quote){return '<span class="xt">'+tagName(id)+'<small>din «'+quote+'»</small><button type="button" aria-label="Șterge eticheta '+tagName(id)+'">×</button></span>'}
function onbScreen(R){
  var nAct=R.cards.length;
  var top='<div class="onbtop"><button type="button" data-go="form">Prefer formularul</button><span class="prog">pasul 4 din 4</span><button type="button" data-go="feed">Sari peste</button></div>';
  var tally='';
  if(S.v==='a'&&R.next)tally='<div class="tally" role="status">Până acum: <b>'+nAct+' acte</b> te privesc · cel mai apropiat termen <b>'+fdShort(R.next.dl)+'</b> (mai ai '+zile(R.next.days)+')</div>';
  if(S.v==='c')tally='<div class="tally" role="status">Impact pe 12 luni, până acum: <b>≈ '+sgn(R.total)+' lei</b></div>';
  var msgs=
   '<p class="bub as">Salut. Te ajut să afli ce legi noi îți schimbă banii. Nu sunt consultant financiar: îți arăt ce scrie în lege și cât te atinge pe tine. Cum câștigi bani?</p>'+
   '<p class="bub us">Sunt programator angajat și am și un SRL din care iau dividende.</p>'+
   '<p class="bub as">Am notat trei etichete. Șterge-le dacă am greșit.</p><div class="xtr">'+xt('angajat','angajat')+xt('angajat_it','programator')+xt('srl_dividende','iau dividende')+'</div>'+
   '<p class="bub as">Unde locuiești: cu chirie, în proprietate sau cu credit?</p>'+
   '<p class="bub us">Stau în chirie, plătesc gaz și curent.</p><div class="xtr">'+xt('chirias','chirie')+xt('consumator_gaz','gaz')+xt('consumator_energie','curent')+'</div>'+
   '<p class="bub as">Contribui la o pensie privată?</p><div class="qr" role="group" aria-label="Răspunsuri rapide"><button type="button">Pilon II</button><button type="button">Pilon III</button><button type="button">Amândouă</button><button type="button">Nu știu</button></div>'+
   '<p class="bub us">Pilon II, cred.</p><div class="xtr">'+xt('pilon2','Pilon II')+'</div>';
  var fin='<div class="final"><p class="hook">Am găsit '+nAct+' acte care te privesc.</p><p>'+(R.next?'Cel mai apropiat termen: '+fd(R.next.dl)+' (mai ai '+zile(R.next.days)+'). ':'')+'Le poți vedea pe toate, cu link la articolul din lege.</p><button type="button" class="cta" data-go="feed">Vezi ce te privește</button></div>';
  return header()+top+tally+msgs+fin+'<div class="compose"><label class="vh" for="msg">Mesaj pentru asistent</label><input id="msg" placeholder="Scrie aici…"><button type="button" aria-label="Trimite">↑</button></div>';
}
function formScreen(){
  function ck(id,on){return '<label class="ck"><input type="checkbox"'+(on?' checked':'')+'>'+tagName(id)+'</label>'}
  var mine=activeTags();
  var fs=GROUPS.filter(function(g){return g!=='Domeniul meu'}).map(function(G){
    return '<fieldset><legend>'+G+'</legend>'+Object.keys(TAGS).filter(function(t){return TAGS[t][1]===G}).map(function(t){return ck(t,mine.indexOf(t)>=0)}).join('')+'</fieldset>'});
  var dom='<fieldset><legend>Domeniul meu</legend><label class="fld" for="dom">În ce domeniu lucrezi?</label><select id="dom" class="inp" aria-describedby="domh">'+
   ['—','IT','construcții','agricultură','HoReCa','altul'].map(function(o){return '<option'+(o==='IT'?' selected':'')+'>'+o+'</option>'}).join('')+'</select><p class="help" id="domh">Unele acte schimbă impozitul pe domenii (de exemplu OUG 156/2024).</p></fieldset>';
  return header()+'<div class="onbtop"><button type="button" data-go="onb">Înapoi la conversație</button><button type="button" data-go="feed">Sari peste</button></div>'+
   '<p class="'+(S.v==='b'?'lede':'sub')+'">Bifează ce ți se potrivește. Durează un minut.</p>'+fs[0]+dom+fs.slice(1).join('')+
   '<button type="button" class="cta" data-go="feed">Vezi ce te privește</button><p class="disc">Răspunsurile rămân pe telefonul tău. Fără cont, fără bancă.</p>';
}

/* ======================= Stări ======================= */
function skel(n){var s='';for(var i=0;i<n;i++)s+='<div class="skcard"><div class="sk" style="width:40%"></div><div class="sk" style="width:85%;height:18px"></div><div class="sk" style="width:60%"></div></div>';return s}
function statesScreen(){
  var r=function(t,sub,html){return '<h3>'+t+' <small>· '+sub+'</small></h3>'+html};
  var L=function(t){return '<p class="stlabel">'+t+'</p>'};
  return header()+'<div class="sheet">'+
  r('Notificarea','gol','<div class="stbox"><b>Nu trimitem nimic</b>Când niciun act nu atinge etichetele tale, nu primești notificări. Deschis manual, fluxul spune „Nimic nou din '+fdShort(S.d)+'”.</div>')+
  r('Notificarea','eroare','<div class="stbox err" role="alert"><b>Nu am putut încărca actele noi</b>Îți arătăm ce știm de la ultima actualizare, 28 oct 2026. Sumele și termenele de acolo rămân valabile.<button type="button" class="btn2">Reîncearcă</button></div>')+
  r('Noutăți','gol','<div class="stbox"><b>Nimic nou care să te privească</b>Niciun act din setul curent nu atinge etichetele tale. Ultima verificare: 28 oct 2026.<button type="button" class="cta" data-go="profile">Adaugă etichete</button></div>')+
  r('Noutăți','încărcare','<div aria-busy="true" aria-live="polite">'+L('Se încarcă actele care te privesc…')+skel(2)+'</div>')+
  r('Noutăți','eroare','<div class="stbox err" role="alert"><b>Nu am putut actualiza fluxul</b>Vezi versiunea din 28 oct 2026. Termenele sunt calculate față de data de azi, deci rămân corecte.<button type="button" class="btn2">Reîncearcă</button></div>')+
  r('Card + simulare','eroare','<div class="stbox err" role="alert"><b>Nu putem simula această acțiune</b>Ne lipsește un număr din profil (de exemplu, cât încasezi din dividende). Fără el, nu inventăm o sumă.<button type="button" class="btn2" data-go="profile">Completează profilul</button></div>')+
  r('Planul meu','gol','<div class="stbox"><b>Nicio acțiune aleasă încă</b>Linia punctată apare când pornești „Simulează” pe un card. Până atunci vezi doar impactul fără acțiuni.<button type="button" class="cta" data-go="feed">Alege o acțiune</button></div>')+
  r('Planul meu','încărcare','<div aria-busy="true">'+L('Recalculăm cele 12 luni…')+'<div class="skcard"><div class="sk" style="height:120px"></div></div></div>')+
  r('Planul meu','eroare','<div class="stbox err" role="alert"><b>Nu putem calcula planul</b>Profilul nu are nicio etichetă de venit. Adaugă una ca să vezi sumele.<button type="button" class="btn2" data-go="profile">Deschide Profilul</button></div>')+
  r('Profil','gol','<div class="stbox"><b>Profilul e gol</b>Fără etichete nu primești notificări și fluxul e gol. Spune-i asistentului cum câștigi și unde locuiești.<button type="button" class="cta" data-go="onb">Începe conversația</button><button type="button" class="btn2" data-go="form">Formular</button></div>')+
  r('Profil','eroare','<div class="stbox err" role="alert"><b>Eticheta nu s-a salvat</b>Telefonul nu a permis salvarea. Profilul de mai înainte rămâne neschimbat.<button type="button" class="btn2">Reîncearcă</button></div>')+
  r('Onboarding','gol','<p class="bub as">Salut. Te ajut să afli ce legi noi îți schimbă banii. Nu sunt consultant financiar. Cum câștigi bani?</p><div class="qr"><button type="button">Salariat</button><button type="button">PFA</button><button type="button">SRL</button><button type="button">Pensionar</button></div>')+
  r('Onboarding','încărcare','<p class="bub as" aria-busy="true" aria-label="Asistentul scrie"><span class="typing"><i></i><i></i><i></i></span></p>')+
  r('Onboarding','eroare','<p class="bub as" role="alert">Nu am înțeles din ce câștigi. Alege mai jos sau folosește formularul.</p><div class="qr"><button type="button">Salariat</button><button type="button">PFA</button><button type="button" data-go="form">Formular</button></div>')+
  r('Formular','eroare','<label class="fld" for="e1">Venit brut lunar (lei)</label><input id="e1" class="inp" aria-invalid="true" aria-describedby="e1e" value="8 000 lei/lună"><p class="err" id="e1e" role="alert">Scrie doar cifre, de exemplu 8000.</p>')+
  '</div>';
}

/* ---------- randare + evenimente ---------- */
function render(){
  document.body.className=(S.v==='e'||S.v==='f'?'v-d v-'+S.v:'v-'+S.v)+(S.bar?' hasbar':'');
  var R=calc(),h='';
  var isFeed=S.s==='feed'||S.s==='card',showPlan=isFeed&&S.v!=='c'&&!isD();
  document.documentElement.style.setProperty('--planh',showPlan?'78px':'0px');
  if(S.s==='notif')h=notifScreen(R);
  else{
    var main=S.s==='plan'?planScreen(R):S.s==='profile'?profileScreen():S.s==='onb'?onbScreen(R):S.s==='form'?formScreen():S.s==='stari'?statesScreen():(S.v==='a'?feedA(R):S.v==='c'?feedC(R):isD()?feedD(R):feedB(R));
    h='<div class="app'+(isD()&&isFeed?' wide':'')+'"><main>'+main+'</main></div>'+(showPlan?planBar(R):'')+(S.s==='onb'||S.s==='form'?'':tabBar());
  }
  if(S.bar)h+=protoBar();
  document.getElementById('root').innerHTML=h;
}
function protoBar(){
  var sel=function(name,opts,cur){return '<select data-set="'+name+'" aria-label="'+name+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'};
  return '<div class="proto" role="toolbar" aria-label="Bara de prototip"><button type="button" data-cyc="-1" aria-label="Varianta anterioară">←</button><span class="lbl">'+S.v.toUpperCase()+' · '+VARIANTS[S.v]+'</span><button type="button" data-cyc="1" aria-label="Varianta următoare">→</button>'+
   sel('s',Object.keys(SCREENS).map(function(k){return [k,SCREENS[k]]}),S.s)+sel('d',DEMO_DATES,S.d)+sel('p',Object.keys(PERSONAS).map(function(k){return [k,PERSONAS[k].name]}),S.p)+'</div>';
}
function sync(){
  var q=new URLSearchParams();q.set('v',S.v);q.set('s',S.s);if(S.d!==DEMO_DATES[0][0])q.set('d',S.d);if(S.p!=='andrei')q.set('p',S.p);
  var on=Object.keys(S.on).filter(function(k){return S.on[k]});if(on.length)q.set('on',on.join(','));if(S.open)q.set('open',S.open);if(!S.bar)q.set('bar','0');
  history.replaceState(null,'','?'+q.toString());
}
function go(s){S.s=s;if(s!=='card')S.open=null;sync();render();window.scrollTo(0,0)}
function scrollToCard(id){var el=document.getElementById('c-'+id);if(el)window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-12))}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  if(b.dataset.cyc){var k=Object.keys(VARIANTS),i=(k.indexOf(S.v)+(+b.dataset.cyc)+k.length)%k.length;S.v=k[i];sync();render();return}
  if(b.dataset.open){S.s='card';S.open=b.dataset.open;sync();render();scrollToCard(S.open);return}
  if(b.dataset.tog){var id=b.dataset.tog;S.open=S.open===id?null:id;S.s=S.open?'card':'feed';sync();render();if(S.open)scrollToCard(id);return}
  if(b.dataset.sim){S.on[b.dataset.sim]=!S.on[b.dataset.sim];var y=window.scrollY;sync();render();window.scrollTo(0,y);return}
  if(b.dataset.rm){S.removed.push(b.dataset.rm);render();return}
  if(b.dataset.f){S.f=b.dataset.f;render();return}
});
document.addEventListener('change',function(e){var s=e.target.dataset.set;if(!s)return;S[s]=e.target.value;if(s==='s'&&S.s!=='card')S.open=null;sync();render();window.scrollTo(0,0)});
document.addEventListener('keydown',function(e){
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var k=Object.keys(VARIANTS),i=(k.indexOf(S.v)+(e.key==='ArrowRight'?1:-1)+k.length)%k.length;S.v=k[i];sync();render()}
});
/* ?s=card fără open: deschide cardul ales de regula notificării */
if(S.s==='card'&&!S.open){var n=pickNotif(calc());S.open=n?n.r.id:null}
render();
if(S.s==='card'&&S.open)scrollToCard(S.open);
</script>
</body>
</html>
