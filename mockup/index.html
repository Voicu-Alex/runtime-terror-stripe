<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ce înseamnă pentru mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4EF; --card:#FFFFFF; --ink:#14201B; --ink-2:#4A5851; --line:#D6DCD3;
  --accent:#2A3BC9; --accent-soft:#E7EAFB;
  --neg:#9A4630; --pos:#1E7A4B; --pos-soft:#E1F1E7;
  --dark-neg:#F0AE98; --dark-pos:#86D9A9;
  --r:14px; --tb:59px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:calc(215px + env(safe-area-inset-bottom))}
body.nobar{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* header */
header{padding:18px 0 4px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1;margin:0}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.badge{display:inline-block;margin-top:8px;font-size:13px;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:999px;padding:3px 10px}

/* personas */
.sect{margin-top:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;min-height:44px}
.pchip[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.who{margin:18px 0 0;font-size:14px;color:var(--ink-2)}
.who b{color:var(--ink)}
.feed-head{margin:18px 0 10px;font-size:14px;color:var(--ink-2)}
.empty{background:var(--card);border:1px dashed var(--ink-2);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* headline */
.hero{margin-top:14px;background:var(--ink);color:var(--paper);border-radius:18px;padding:22px 20px 18px}
.hero h2{margin:0;font-size:16px;font-weight:500;opacity:.8}
.win{margin:2px 0 0;font-size:12.5px;opacity:.6}
.big{font-size:clamp(46px,15vw,76px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 2px}
.big small{font-size:.28em;font-weight:600;letter-spacing:0;opacity:.75;margin-left:6px}
.big.neg{color:var(--dark-neg)} .big.pos{color:var(--dark-pos)}
.with{font-size:17px;font-weight:600;margin:10px 0 0}
.with b{font-weight:800;font-size:1.15em}
.with .neg{color:var(--dark-neg)} .with .pos{color:var(--dark-pos)}
.conf{margin:14px 0 0;font-size:13px;opacity:.75;display:flex;gap:8px;align-items:flex-start}
.ilus{flex:none;border:1px solid currentColor;border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}

/* cards */
.tl-head{margin:26px 0 10px;font-size:14px;color:var(--ink-2)}
ol.tl,ul.feed{list-style:none;margin:0;padding:0}
ul.feed>li{margin:0 0 12px}
.tl>li{position:relative;padding:0 0 14px 30px}
.tl>li::before{content:"";position:absolute;left:8px;top:24px;bottom:-4px;width:2px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl>li::after{content:"";position:absolute;left:1px;top:15px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink)}
.tl>li.soon::after{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line)}
.pill.date{background:var(--paper)}
.pill.st-proiect{background:var(--paper);color:var(--ink-2);border:1px dashed var(--ink-2)}
.pill.st-adoptat{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.st-in_vigoare{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.pill.st-termen_depasit{background:#E6E8E4;color:#6B766F;border-color:#C3CAC2}
.card h3{margin:10px 0 6px;font-size:19px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
.imp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:4px 0 6px;font-size:15px}
.imp .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.imp .u{font-weight:600;color:var(--ink-2)}
.imp .lead{flex-basis:100%}
.imp .amt{display:inline-flex;align-items:baseline;gap:4px 8px;white-space:nowrap;flex-wrap:nowrap}
.imp .v.zero{font-size:17px;font-weight:700;color:var(--ink-2)}
.legal .chk{display:inline-block;font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px;margin-left:6px}
.pill.demo{background:var(--paper);color:var(--ink-2);border-style:dashed;font-size:11px;padding:0 7px;margin-left:6px}
.imp .est{font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px}
.neg{color:var(--neg)} .pos{color:var(--pos)} .zero{color:var(--ink)}
.imp small{flex-basis:100%;color:var(--ink-2);font-size:13.5px}
.why{margin:6px 0 12px;color:var(--ink-2);font-size:15px;max-width:60ch}
.act{background:var(--paper);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.act.on{background:var(--accent-soft)}
.act p{margin:0;font-size:14.5px;grid-column:1/-1}
.act p b{font-weight:700}
.sw{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;min-height:44px;font-size:13px;font-weight:600}
.track{width:44px;height:26px;border-radius:999px;background:#9AA39C;position:relative;transition:background .15s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] .track{background:var(--accent)}
.sw[aria-checked="true"] .track::after{transform:translateX(18px)}
.act.exp{background:#ECEEEA}.act.exp p:first-child{color:var(--ink-2)}
.sw[disabled]{opacity:.4;cursor:not-allowed}
.res.miss{color:var(--ink-2);font-weight:600}
.tl>li.soon .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.res{grid-column:1/-1;margin:0;font-weight:700;font-size:14.5px;color:var(--pos)}
.res.chk{color:var(--accent)}
.noact{background:var(--paper);border-radius:10px;padding:10px 12px;margin:0;font-size:14px;color:var(--ink-2)}
.foot{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.src{border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:600;color:var(--ink)}

/* feed card */
.fc{padding:0;overflow:hidden}
.chead{display:block;width:100%;text-align:left;border:0;background:none;padding:16px 44px 14px 16px;position:relative}
.chead h3{margin-top:10px}
.chead::after{content:"";position:absolute;right:18px;top:20px;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .15s}
.chead[aria-expanded="true"]::after{transform:rotate(-135deg);top:24px}
.fc .detail{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.fc .detail .why{margin-top:0}
.tgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.tg{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:2px 9px}
.legal{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.legal h5{margin:0 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.legal p{margin:0 0 8px;font-weight:600}
.legal a,.legal .off{display:block;padding:5px 0;font-weight:600}
.legal .off{color:var(--ink-2);font-weight:500}
.legal .vf{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-2)}

/* profile */
.grp{margin-top:18px}
.grp h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.ptag{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 14px;font-weight:600;font-size:15px}
.ptag button{border:0;background:var(--paper);width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.reset{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chat{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.chat h3{margin:0 0 12px;font-size:17px;line-height:1.25}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;margin:0 0 8px}
.bub.as{background:var(--paper);border-bottom-left-radius:4px}
.bub.us{background:var(--accent);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.xtr{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.xtr .tg{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fake{display:flex;gap:8px;align-items:center}
.fake input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;background:var(--paper);color:var(--ink-2)}
.fake button{border:0;background:var(--line);color:var(--ink-2);border-radius:50%;width:44px;height:44px;font-size:18px}
.lnkbtn{display:inline-block;margin-top:12px;border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:15px}

footer{margin-top:22px;font-size:13px;color:var(--ink-2)}
footer p{margin:0 0 8px;max-width:62ch}

/* plan bar + tab bar */
.plan{position:fixed;left:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom));z-index:10;pointer-events:none}
.plan.hidden{display:none}
.plan .in{pointer-events:auto;max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,32,27,.16);padding:12px 16px 12px}
.plan h4{margin:0 0 6px;font-size:14px;font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pg div span{display:block;font-size:12.5px;color:var(--ink-2)}
.pg div b{display:block;font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.pg div:last-child{text-align:right}
.plan .sub{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

/* opening overlay */
.ovl{position:fixed;inset:0;z-index:30}
.ovb{position:absolute;inset:0;background:rgba(20,32,27,.55)}
.notif{position:absolute;top:14px;left:12px;right:12px;max-width:420px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:22px;padding:14px 16px 12px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.nh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.nh .ic{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.nh b{color:var(--ink);font-weight:700}
.nh .nt{margin-left:auto}
.ntitle{margin:8px 0 4px;font-size:17px;font-weight:700;line-height:1.25}
.nline{margin:0 0 12px;font-size:14.5px;color:var(--ink-2)}
.nline b{color:var(--neg)}
.cta{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:12px;min-height:46px}
.nclose{display:block;margin:8px auto 0;border:0;background:none;color:var(--ink-2);text-decoration:underline;font-size:14px;padding:8px 12px}

@media (min-width:700px){.brand{font-size:26px}.card{padding:20px}.fc{padding:0}.chead{padding:20px 48px 16px 20px}.fc .detail{padding:16px 20px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var state={lang:'ro',tab:'feed',profile:'andrei',on:{},open:{},removed:{andrei:[],maria:[],ion:[]},overlay:true};

/* ---- helpers ---- */
function t(k,v){var s=(DICT[state.lang][k]!==undefined?DICT[state.lang][k]:k);if(v){for(var x in v)s=s.split('{'+x+'}').join(v[x]);}return s}
function L(o){return o[state.lang]}
function sepThousands(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,state.lang==='ro'?'.':',')}
function fmtNum(n){return sepThousands(String(Math.round(Math.abs(n))))}
function fmtSave(n){
  if(Math.abs(n-Math.round(n))<0.05)return fmtNum(n);
  var s=(Math.round(Math.abs(n)*10)/10).toFixed(1).split('.');
  return sepThousands(s[0])+(state.lang==='ro'?',':'.')+s[1];
}
function signed(n){var r=Math.round(n);return (r<0?'−':(r>0?'+':''))+fmtNum(r)}
function cls(n){var r=Math.round(n);return r<0?'neg':(r>0?'pos':'zero')}
function fmtMonth(iso){var p=iso.split('-');return MONTHS[state.lang][+p[1]-1]+' '+p[0]}
function fmtDate(iso){var p=iso.split('-');return (+p[2])+' '+MONTHS[state.lang][+p[1]-1]+' '+p[0]}
function dayN(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000}
function monthsIn(effIso){
  if(effIso<=TODAY)return 12;
  return Math.max(0,Math.min(12,Math.round((dayN(WINDOW_END)-dayN(effIso))/30.4375)));
}
function tagLabel(id){return TAGS[id]?TAGS[id][state.lang]:id}
function activeTags(pid){var rm=state.removed[pid]||[];return PERSONAS[pid].tags.filter(function(x){return rm.indexOf(x)<0})}

/* ---- calculation ---- */
function calc(pid,on){
  var p=PERSONAS[pid],tags=activeTags(pid),base=0,delta=0,count=0,next=null,cards=[];
  RULES.forEach(function(r){
    var common=tags.filter(function(x){return r.tags.indexOf(x)>=0});
    if(!common.length)return;
    var m=Math.round(r.impact(p)),a=r.action,mo=monthsIn(r.effective);
    var sv=a.saving?a.saving(p):0;
    var expired=!!(a.deadline&&a.deadline<TODAY);
    var isOn=!!(!expired&&on[r.id]);
    var eff=m;
    base+=m*mo;
    if(a.deadline&&a.deadline>=TODAY&&(!next||a.deadline<next))next=a.deadline;
    if(isOn){count++;delta+=sv*mo;eff+=sv;}
    cards.push({r:r,m:m,a:a,sv:sv,on:isOn,expired:expired,months:mo,eff:Math.round(eff),common:common,
      status:expired?'termen_depasit':r.status});
  });
  return {base:base,withActions:base+delta,delta:delta,count:count,next:next,cards:cards};
}

/* ---- html builders ---- */
function tagChips(ids){return ids.map(function(x){return '<span class="tg">'+tagLabel(x)+'</span>'}).join('')}

function impactHtml(c){
  var r=c.r,soon=r.effective>TODAY;
  var lead=soon?t('for.from',{d:fmtMonth(r.effective)}):t('for.you');
  var est=ESTIMATE_IDS.indexOf(r.id)>=0?'<span class="est">'+t('est')+'</span>':'';
  var note=NOTES[r.id]?'<small>'+L(NOTES[r.id])+'</small>':'';
  var amt=c.eff===0?'<span class="v zero">'+t('info')+'</span>':'<span class="v '+cls(c.eff)+'">'+signed(c.eff)+'</span><span class="u">'+t('unit.mo')+'</span>';
  return '<div class="imp"><span class="u lead">'+lead+'</span><span class="amt">'+amt+est+'</span>'+note+'</div>';
}
function actionHtml(c){
  var a=c.a,id=c.r.id;
  var when=a.deadline?t('before',{d:fmtDate(a.deadline)}):t('anytime');
  var res='',cl='act',info=!c.sv;
  if(c.expired){
    cl+=' exp';
    if(!info)res='<p class="res miss">'+t('res.missed',{d:fmtDate(a.deadline),n:fmtNum(c.sv*c.months)})+'</p>';
  }else if(c.on){
    cl+=' on';
    res=info?'<p class="res chk">'+t('res.chk')+'</p>':'<p class="res">'+t('res.mo',{n:fmtSave(c.sv)})+'</p>';
  }
  return '<div class="'+cl+'"><p><b>'+when+'</b> '+L(a)+'</p>'+
    '<button type="button" class="sw" role="switch" aria-checked="'+c.on+'" data-rule="'+id+'"'+(c.expired?' disabled':'')+'><span class="track"></span>'+t('sim')+'</button>'+res+'</div>';
}
function pill(c){return '<span class="pill st-'+c.status+'">'+t('st.'+c.status)+'</span>'}
function enText(s){
  if(state.lang!=='en')return s;
  var M={ian:'Jan',iun:'Jun',iul:'Jul',noi:'Nov',mai:'May'};
  return s.replace(/\b(ian|iun|iul|noi|mai|feb|mar|apr|aug|sep|oct|dec)\b/g,function(m){return M[m]||m.charAt(0).toUpperCase()+m.slice(1)}).replace('modificată prin','amended by').replace('text de bază','base text');
}
function legalHtml(c){
  var r=c.r,ref=enText(r.mo_ref);
  var art=r.article.indexOf('articol de confirmat')===0?t('art.tbc')+r.article.slice(20):r.article;
  var chip=(r.article.indexOf('confirmat')>=0||LOW_IDS.indexOf(r.id)>=0)?' <span class="chk">'+t('tbc')+'</span>':'';
  var law=r.legal_url.indexOf('http')===0?'<a href="'+r.legal_url+'" target="_blank" rel="noopener">'+t('law',{a:art})+'</a>'+chip:'<span class="off">'+t('law.off',{a:art})+'</span>';
  var sec=r.secondary_url.indexOf('http')===0?'<a href="'+r.secondary_url+'" target="_blank" rel="noopener">'+t('sec')+'</a>':'<span class="off">'+t('sec.off')+'</span>';
  return '<div class="legal"><h5>'+t('legal')+'</h5><p>'+enText(r.act)+' · '+ref+'</p>'+law+sec+'<span class="vf">'+t('verified',{d:fmtDate(r.verified_at)})+'</span></div>';
}

function feedCardHtml(c){
  var r=c.r,open=!!state.open[r.id];
  var detail=open?'<div class="detail" id="d-'+r.id+'"><p class="why">'+L(r.why)+'</p>'+actionHtml(c)+legalHtml(c)+'</div>':'';
  return '<li><article class="card fc" id="c-'+r.id+'">'+
    '<button type="button" class="chead" data-exp="'+r.id+'" aria-expanded="'+open+'">'+
    '<div class="meta"><span class="pill date">'+fmtDate(r.published)+'</span>'+pill(c)+'</div>'+
    '<h3>'+L(r.title)+'</h3>'+impactHtml(c)+
    '<div class="tgrow"><span>'+t('tags.as')+'</span>'+tagChips(c.common)+'</div>'+
    '</button>'+detail+'</article></li>';
}
function planCardHtml(c){
  var r=c.r,soon=r.effective>TODAY;
  return '<li class="'+(soon?'soon':'')+'"><article class="card">'+
    '<div class="meta"><span class="pill date">'+fmtDate(r.effective)+'</span>'+pill(c)+'</div>'+
    '<h3>'+L(r.title)+'</h3>'+impactHtml(c)+'<p class="why">'+L(r.why)+'</p>'+actionHtml(c)+
    '<div class="foot"><span class="src">'+enText(r.act)+'</span><span>'+t('verified',{d:fmtDate(r.verified_at)})+'</span></div>'+
    '</article></li>';
}
function emptyHtml(){return '<div class="empty"><b>'+t('empty.t')+'</b>'+t('empty.d')+'</div>'}

function personaChips(){
  return '<section class="sect" aria-label="'+t('profiles')+'"><div class="chips" role="radiogroup" aria-label="'+t('profiles')+'">'+
    Object.keys(PERSONAS).map(function(k){return '<button type="button" class="pchip" role="radio" aria-checked="'+(k===state.profile)+'" data-profile="'+k+'">'+PERSONAS[k].name+'</button>'}).join('')+'</div></section>';
}
function feedHtml(res){
  var cards=res.cards.slice().sort(function(a,b){return a.r.published<b.r.published?1:(a.r.published>b.r.published?-1:0)});
  return personaChips()+'<p class="feed-head">'+t('feed.head')+'</p>'+
    (cards.length?'<ul class="feed">'+cards.map(feedCardHtml).join('')+'</ul>':emptyHtml());
}
function planHtml(res){
  var cards=res.cards.slice().sort(function(a,b){return a.r.effective<b.r.effective?-1:(a.r.effective>b.r.effective?1:0)});
  var withLine=res.count?
    '<p class="with">'+t('hero.with')+' <b class="'+cls(res.withActions)+'">'+signed(res.withActions)+' '+t('unit.lei')+'</b></p>':
    '<p class="with" style="font-weight:500;opacity:.8">'+t('hero.none')+'</p>';
  return '<p class="who">'+t('who',{n:'<b>'+PERSONAS[state.profile].name+'</b>'})+'</p>'+
   '<section class="hero" aria-live="polite"><h2>'+t('hero.title')+'</h2><p class="win">'+t('hero.window',{a:fmtDate(TODAY),b:fmtDate(WINDOW_END)})+'</p><div class="big '+cls(res.base)+'">'+signed(res.base)+'<small>'+t('hero.per')+'</small></div>'+withLine+
   '<p class="conf"><span class="ilus">'+t('ilus')+'</span><span>'+t('hero.conf')+'</span></p></section>'+
   '<p class="tl-head">'+t('tl.head')+'</p>'+
   (cards.length?'<ol class="tl">'+cards.map(planCardHtml).join('')+'</ol>':emptyHtml());
}
function profileHtml(){
  var tags=activeTags(state.profile),out='';
  GROUPS.forEach(function(g){
    var ids=tags.filter(function(x){return TAGS[x].g===g});
    if(!ids.length)return;
    out+='<div class="grp"><h3>'+t('pf.'+g)+'</h3><div class="chips">'+ids.map(function(x){
      return '<span class="ptag">'+tagLabel(x)+'<button type="button" data-rm="'+x+'" aria-label="'+t('pf.remove',{t:tagLabel(x)})+'">×</button></span>';
    }).join('')+'</div></div>';
  });
  if(!tags.length)out='<p class="feed-head">'+t('pf.empty')+'</p>';
  var reset=(state.removed[state.profile]||[]).length?'<button type="button" class="reset" data-reset="1">'+t('pf.reset')+'</button>':'';
  var extracted=['angajat_it','srl_dividende','chirias','sofer'];
  return '<p class="who">'+t('who',{n:'<b>'+PERSONAS[state.profile].name+'</b>'})+'</p>'+out+reset+
    '<section class="chat" aria-label="'+t('chat.h')+'"><h3>'+t('chat.h')+'</h3>'+
    '<p class="bub as">'+t('chat.a1')+'</p><p class="bub us">'+t('chat.u')+'</p><p class="bub as">'+t('chat.a2')+'</p>'+
    '<div class="xtr">'+tagChips(extracted)+'</div>'+
    '<div class="fake"><input type="text" placeholder="'+t('chat.ph')+'" disabled aria-label="'+t('chat.ph')+'"><button type="button" disabled aria-hidden="true">↑</button></div>'+
    '<button type="button" class="lnkbtn" data-noop="1">'+t('chat.form')+'</button></section>';
}
function planBarHtml(res){
  var n=res.count;
  var nTxt=n===0?t('plan.n0'):(n===1?t('plan.n1'):t('plan.nn',{n:n}));
  var nextTxt=' · '+(res.next?t('plan.next',{d:fmtDate(res.next)}):t('plan.none'));
  return '<h4>'+t('plan.title')+'</h4><div class="pg"><div><span>'+t('plan.without')+'</span><b class="'+cls(res.base)+'">'+t('plan.yr',{n:signed(res.base)})+'</b></div>'+
   '<div><span>'+t('plan.with')+'</span><b class="'+cls(res.withActions)+'">'+t('plan.yr',{n:signed(res.withActions)})+'</b></div></div>'+
   '<p class="sub">'+nTxt+nextTxt+'</p>';
}
var ICONS={
 feed:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
 plan:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>',
 profile:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-4 4-6 7.500-6s6.500 2 7.500 6"/></svg>'
};
function tabsHtml(){
  return '<div class="in" role="tablist">'+['feed','plan','profile'].map(function(k){
    return '<button type="button" class="tab" role="tab" aria-selected="'+(state.tab===k)+'" data-tab="'+k+'">'+ICONS[k]+'<span>'+t('tab.'+k)+'</span></button>';
  }).join('')+'</div>';
}
function overlayHtml(res){
  var c=null;res.cards.forEach(function(x){if(x.r.id===HERO_ID)c=x});
  if(!c)return '';
  var tg=c.common.slice(0,2).map(tagLabel).join(', ');
  var line=(c.eff===0&&c.a.deadline)?t('ov.line0',{d:fmtDate(c.a.deadline),t:tg}):t('ov.line',{v:'<b>'+signed(c.eff)+'</b>',t:tg});
  return '<div class="ovl"><div class="ovb" data-close="1"></div><div class="notif" role="dialog" aria-label="'+t('brand')+'">'+
    '<div class="nh"><span class="ic">€</span><b>'+t('brand')+'</b><span class="nt">'+fmtDate(c.r.published)+'<span class="pill demo">'+t('demo')+'</span></span></div>'+
    '<p class="ntitle">'+L(c.r.title)+'</p>'+
    '<p class="nline">'+line+'</p>'+
    '<button type="button" class="cta" data-cta="1">'+t('ov.cta')+'</button>'+
    '<button type="button" class="nclose" data-close="1">'+t('ov.close')+'</button></div></div>';
}

/* ---- render ---- */
function render(focusSel){
  var res=calc(state.profile,state.on);
  document.documentElement.lang=state.lang;
  document.title=t('brand');
  document.getElementById('brand').textContent=t('brand');
  document.getElementById('badge').textContent=t('badge');
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===state.lang)});
  document.getElementById('app').innerHTML=state.tab==='feed'?feedHtml(res):(state.tab==='plan'?planHtml(res):profileHtml());
  document.getElementById('tabs').innerHTML=tabsHtml();
  var showBar=state.tab!=='profile';
  document.getElementById('planwrap').className='plan'+(showBar?'':' hidden');
  document.body.className=showBar?'':'nobar';
  document.getElementById('plan').innerHTML=planBarHtml(res);
  document.getElementById('foot').innerHTML='<p>'+t('foot.lim')+'</p><p>'+t('foot.src')+'</p>';
  document.getElementById('ovl').innerHTML=state.overlay?overlayHtml(res):'';
  if(focusSel){var el=document.querySelector(focusSel);if(el)el.focus({preventScroll:true})}
}

function init(){
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-lang],[data-profile],[data-rule],[data-exp],[data-tab],[data-rm],[data-reset],[data-close],[data-cta],[data-noop]');
    if(!el)return;
    var d=el.dataset;
    if(d.lang){state.lang=d.lang;render()}
    else if(d.profile){state.profile=d.profile;state.on={};state.open={};render()}
    else if(d.rule){state.on[d.rule]=!state.on[d.rule];render('[data-rule="'+d.rule+'"]')}
    else if(d.exp){state.open[d.exp]=!state.open[d.exp];render('[data-exp="'+d.exp+'"]')}
    else if(d.tab){state.tab=d.tab;state.overlay=false;render();window.scrollTo(0,0)}
    else if(d.rm){state.removed[state.profile].push(d.rm);delete state.on[d.rm];render()}
    else if(d.reset){state.removed[state.profile]=[];render()}
    else if(d.close){state.overlay=false;render()}
    else if(d.cta){
      state.overlay=false;state.tab='feed';state.open[HERO_ID]=true;render();
      var c=document.getElementById('c-'+HERO_ID);
      if(c){window.scrollTo({top:c.getBoundingClientRect().top+window.scrollY-72});c.classList.add('flash')}
    }
    else if(d.noop){e.preventDefault()}
  });
  render();
}

if(typeof document!=='undefined')init();
if(typeof module!=='undefined')module.exports={RULES:RULES,PERSONAS:PERSONAS,state:state,calc:calc,t:t,signed:signed,feedHtml:feedHtml,planHtml:planHtml,profileHtml:profileHtml,planBarHtml:planBarHtml,overlayHtml:overlayHtml,tabsHtml:tabsHtml};
</script>
</body>
</html>
